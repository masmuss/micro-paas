{{define "layout"}}
<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Micro PaaS Dashboard</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.indigo.min.css" />
        <script src="https://unpkg.com/htmx.org@2.0.0"></script>
        <style>
            :root {
                --pico-font-size: 14px;
            }
            .htmx-indicator {
                display: none;
            }
            .htmx-request .htmx-indicator {
                display: inline;
            }
            .status-badge {
                padding: 2px 8px;
                border-radius: 4px;
                font-size: 0.8em;
                font-weight: bold;
            }
            .status-running {
                background-color: #1a3a1a;
                color: #4ade80;
                border: 1px solid #14532d;
            }
            .status-stopped {
                background-color: #3a1a1a;
                color: #f87171;
                border: 1px solid #7f1d1d;
            }
        </style>
    </head>
    <body>
        <header class="container">
            <nav>
                <ul>
                    <li><strong>🚀 Micro PaaS</strong></li>
                </ul>
                <ul>
                    <li><small id="system-status" style="color: var(--pico-ins-color)">● System Online</small></li>
                </ul>
            </nav>
        </header>

        <main class="container">{{template "content" .}}</main>

        <footer class="container">
            <small>Built with Go, HTMX & Pico.css</small>
        </footer>
    </body>
</html>
{{end}}
